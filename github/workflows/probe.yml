name: 驗證台彩 API 是否可連線

# 這支只做一件事：從 GitHub 的機器試抓台彩官方資料，確認境外 IP 能不能取數。
# 它不會寫入任何檔案，也不會產生 commit。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式
        uses: actions/checkout@v4

      - name: 準備 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 只抓資料、不寫檔
        run: python update_lotto.py --check-only --verbose
