name: 每月更新開獎號碼

# 每月 2 日 UTC 01:17 = 台灣時間 09:17（刻意避開整點，降低被延遲或跳過的機率）
on:
  schedule:
    - cron: "17 1 2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lotto-monthly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式
        uses: actions/checkout@v4

      - name: 準備 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取官方資料並改寫 HTML
        run: python update_lotto.py --verbose

      - name: 判斷是否有變更
        id: diff
        run: |
          if git diff --quiet -- index.html data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "本次沒有新資料，不建立 commit"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- index.html data/
          fi

      - name: 提交並推送
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          git commit -m "chore: 更新開獎資料 $(date -u +%Y-%m-%d)"
          git push